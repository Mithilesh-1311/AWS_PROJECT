name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: pip install pip-audit && pip-audit -r requirements.txt
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build && npm audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          npm run dev > /tmp/eog-vite.log 2>&1 &
          npx playwright test boundaries.spec.ts
        working-directory: frontend
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - run: terraform init -backend=false && terraform validate && terraform test
        working-directory: infra/terraform
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/empty backend/artifacts
          sudo chown -R 10001:10001 backend/artifacts
          export EOG_USER=ci EOG_PROXY_TOKEN=$(openssl rand -hex 32)
          export EOG_PASSWORD_HASH=$(docker run --rm caddy:2.10.2-alpine caddy hash-password --plaintext ci-test-only)
          export EOG_DATASET_PATH=./data/empty
          trap 'docker compose logs --tail 100; docker compose down' EXIT
          docker compose config --quiet
          docker compose up -d --build --wait
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)" = 401
          curl --fail --retry 10 --retry-delay 2 -u ci:ci-test-only http://localhost:8080/api/health
